- name: Désactiver le swap (exigé par kubelet)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Retirer le swap de fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Charger les modules du noyau au démarrage
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Charger les modules maintenant
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: Paramètres réseau requis par Kubernetes
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
    - net.ipv4.ip_forward

- name: Installer containerd
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Créer le dossier de configuration
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Configurer containerd
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Redémarrer containerd

- name: Activer containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Appliquer la configuration de containerd maintenant
  ansible.builtin.meta: flush_handlers

- name: Vérifier que containerd utilise le driver cgroup systemd
  ansible.builtin.command: containerd config dump
  register: containerd_config_dump
  changed_when: false
  failed_when: "'SystemdCgroup = true' not in containerd_config_dump.stdout"
