- name: Désactiver le swap (exigé par kubelet)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Retirer le swap de fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Charger les modules du noyau au démarrage
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Charger les modules maintenant
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: Paramètres réseau requis par Kubernetes
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
    - net.ipv4.ip_forward

- name: Installer containerd
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Créer le dossier de configuration
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Générer la configuration par défaut
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Utiliser le répertoire CNI standard (/opt/cni/bin)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '/usr/lib/cni'
    replace: '/opt/cni/bin'
  notify: Redémarrer containerd

- name: Utiliser le driver cgroup systemd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Redémarrer containerd

- name: Activer containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
