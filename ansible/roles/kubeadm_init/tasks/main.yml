- name: Lire la version de kubeadm installée
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_init_version
  changed_when: false

- name: Déposer la configuration kubeadm
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /root/kubeadm-config.yaml
    mode: "0600"

- name: Initialiser le control plane
  ansible.builtin.command: kubeadm init --config /root/kubeadm-config.yaml
  args:
    creates: /etc/kubernetes/admin.conf

- name: Créer le dossier kubeconfig de l'utilisateur debian
  ansible.builtin.file:
    path: /home/debian/.kube
    state: directory
    owner: debian
    group: debian
    mode: "0700"

- name: Copier le kubeconfig pour debian
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/debian/.kube/config
    remote_src: true
    owner: debian
    group: debian
    mode: "0600"

- name: Récupérer le kubeconfig sur ton poste
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../kubeconfig"
    flat: true

- name: Générer la commande de jointure
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_init_join_cmd
  changed_when: false
